<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HappySmile | Book your appointment</title><style>html,body,#root{margin:0;min-height:100%}
body{background:#f5f8fc}
.hs-app{--navy:#0a2540;--teal:#1f64b0;--teal2:#12467f;--mint:#e9f0fa;--ink:#14293f;--mut:#5a6e86;--line:#dce5ef;--gold:#a9854f;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(1200px 500px at 85% -10%,#dbe7f6 0,transparent 60%),#f5f8fc;line-height:1.5;-webkit-font-smoothing:antialiased}
.hs-app *{box-sizing:border-box}
.hs-app h1,.hs-app h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;color:var(--navy);letter-spacing:-.01em;margin:0}

.hs-brand i{display:block;font-style:normal;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.hs-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff}
.hs-switch{display:flex;gap:6px;background:var(--mint);padding:4px;border-radius:999px}
.hs-switch button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:9px 16px;border-radius:999px;font:inherit;font-size:14px;color:var(--teal2);cursor:pointer;min-height:44px}
.hs-switch button span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;font-size:12px;font-weight:700}
.hs-switch button.on{background:var(--navy);color:#fff}
.hs-switch button.on span{background:var(--gold);color:#fff}
main{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px)}
.hs-eyebrow{margin:0 0 8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal2);font-weight:700}
.hs-enq{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,64px);align-items:start}
.hs-hero h1{font-size:clamp(32px,5vw,54px);line-height:1.08}
.hs-lead{font-size:18px;color:var(--mut);max-width:520px;margin:18px 0 26px}
.hs-points{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.hs-points li{display:flex;align-items:baseline;gap:12px;color:var(--mut)}
.hs-points span{font-family:Georgia,serif;font-size:24px;color:var(--navy);min-width:76px}
.hs-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,32px);box-shadow:0 24px 60px -30px rgba(11,46,63,.35)}
.hs-form-card h2,.hs-confirm h2{font-size:26px;margin-bottom:14px}
.hs-form-card label,.hs-form-card fieldset{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 14px;border:0;padding:0}
.hs-form-card legend{padding:0;margin-bottom:6px}
.hs-form-card input,.hs-form-card select,.hs-dash-head select{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--ink);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;min-height:46px}
.hs-form-card input:focus,.hs-form-card select:focus,.hs-dash-head select:focus,.hs-app button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hs-phone{display:flex;gap:8px;align-items:center}.hs-phone span{margin-top:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--mint);color:var(--navy);min-height:46px}
.hs-chips{display:flex;flex-wrap:wrap;gap:8px}
.hs-chip{font:inherit;font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;min-height:44px}
.hs-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hs-btn{display:inline-flex;justify-content:center;align-items:center;width:100%;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal2));cursor:pointer;min-height:48px;box-shadow:0 10px 24px -12px var(--teal2)}
.hs-btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
.hs-btn:hover{filter:brightness(1.05)}
.hs-fine{font-size:12px;color:var(--mut);margin:12px 0 0}.hs-fine.center{text-align:center;margin-top:20px}
.hs-err{color:#b3261e;font-size:14px;margin:0 0 12px}
.hs-confirm{text-align:center}
.hs-ring{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:var(--mint);color:var(--teal2);animation:hs-pulse 1.6s ease-out infinite}
.hs-ring.done{animation:none;background:var(--teal);color:#fff}
@keyframes hs-pulse{0%{box-shadow:0 0 0 0 rgba(31,100,176,.35)}100%{box-shadow:0 0 0 22px rgba(31,100,176,0)}}
.hs-muted{color:var(--mut);margin:0 0 14px}
.hs-count{display:inline-flex;flex-direction:column;margin:4px 0 16px}.hs-count b{font-family:Georgia,serif;font-size:40px;color:var(--navy)}.hs-count span{font-size:12px;color:var(--mut)}
.hs-slot{font-family:Georgia,serif;font-size:24px;color:var(--navy);margin:0 0 14px}.hs-slot i{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-style:normal;font-size:14px;color:var(--mut)}
.hs-steps{list-style:none;padding:0;margin:14px 0;text-align:left;display:grid;gap:10px}
.hs-steps li{display:flex;align-items:center;gap:12px;color:#9aabbf;font-size:15px}
.hs-steps li span{width:14px;height:14px;border-radius:50%;border:2px solid #c5d3e4;flex:none}
.hs-steps li.now{color:var(--navy);font-weight:600}.hs-steps li.now span{border-color:var(--teal);background:var(--mint)}
.hs-steps li.done{color:var(--ink)}.hs-steps li.done span{background:var(--teal);border-color:var(--teal)}
.hs-disc{background:var(--mint);border-radius:12px;padding:12px 14px;font-size:13px;text-align:left;color:var(--navy);margin-bottom:14px}
.hs-actions{display:grid;gap:10px;margin-top:16px}
.hs-dash-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hs-dash-head h1{font-size:clamp(28px,4vw,40px)}.hs-dash-head select{width:auto;min-width:200px;margin:0}
.hs-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.hs-stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column}
.hs-stat span{font-size:12px;color:var(--mut);letter-spacing:.04em}.hs-stat b{font-family:Georgia,serif;font-size:34px;color:var(--navy);font-weight:500}.hs-stat i{font-style:normal;font-size:12px;color:var(--mut)}
.hs-stat.hot{background:var(--navy)}.hs-stat.hot span,.hs-stat.hot i{color:#a8c5ea}.hs-stat.hot b{color:#fff}
.hs-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.hs-tabs button{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;color:var(--ink);min-height:44px}
.hs-tabs button em{font-style:normal;color:var(--mut);margin-left:4px}.hs-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.hs-tabs button.on em{color:#a8c5ea}
.hs-split{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}
.hs-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hs-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--ink);min-height:64px}
.hs-row.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,100,176,.15)}
.hs-av{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--mint);color:var(--teal2);font-weight:700}.hs-av.lg{width:52px;height:52px;font-size:20px}
.hs-row-main{flex:1;min-width:0}.hs-row-main b{display:block}.hs-row-main i,.hs-row-end i{display:block;font-style:normal;font-size:13px;color:var(--mut)}
.hs-row-main u{text-decoration:none;font-size:11px;background:var(--gold);color:#fff;padding:2px 8px;border-radius:999px;margin-left:8px}
.hs-row-end{text-align:right;flex:none}
.hs-pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.hs-pill.booked{background:#dff3e8;color:#1b6b43}.hs-pill.staff{background:#fdeccf;color:#8a5a0c}.hs-pill.noanswer{background:#e8edf3;color:#4a5d74}.hs-pill.calling{background:var(--mint);color:var(--teal2)}
.hs-detail{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2.5vw,26px);position:sticky;top:12px}
.hs-detail-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}.hs-detail-top div{flex:1;min-width:0}.hs-detail-top h2{font-size:24px}.hs-detail-top p{margin:0;color:var(--mut);font-size:14px}
.hs-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:0 0 16px;padding:14px 0;border-block:1px solid var(--line)}
.hs-facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.hs-facts dd{margin:2px 0 0;font-weight:600;color:var(--navy)}
.hs-detail h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal2);margin:16px 0 6px}
.hs-sum{margin:0;color:var(--ink)}
.hs-tr{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hs-tr li{background:#f2f6fb;border-radius:12px;padding:9px 12px;font-size:14px}.hs-tr li.ai{background:var(--mint)}.hs-tr b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.hs-empty{color:var(--mut);padding:20px;text-align:center}
.hs-foot{text-align:center;font-size:12px;color:var(--mut);padding:8px 16px 28px}
@media(max-width:900px){.hs-enq{grid-template-columns:1fr}.hs-split{grid-template-columns:1fr}.hs-detail{position:static}.hs-stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.hs-switch{width:100%}.hs-switch button{flex:1;justify-content:center;padding:9px 8px;font-size:13px}.hs-facts{grid-template-columns:1fr}.hs-row{flex-wrap:wrap}.hs-dash-head select{width:100%}}
@media(prefers-reduced-motion:reduce){.hs-ring{animation:none}}
.hs-mascot{display:block;width:100%;height:auto}
.hs-hero-art{display:flex;align-items:flex-end;gap:20px;margin:6px 0 22px}
.hs-hero-art .hs-mascot{width:150px;flex:none}
.hs-bubble{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:15px;color:var(--navy);box-shadow:0 12px 30px -18px rgba(10,37,64,.4);max-width:330px}
.hs-bubble b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal2);margin-bottom:2px}
.hs-how{display:grid;gap:12px;margin:26px 0 0;padding:0;list-style:none;counter-reset:s}
.hs-how li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:s}
.hs-how li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700}
.hs-how b{display:block;color:var(--navy)}.hs-how span{color:var(--mut);font-size:14px}
.hs-trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.hs-trust div{font-size:12px;color:var(--mut)}.hs-trust b{display:block;font-size:13px;color:var(--navy)}
.hs-avatar-ai{display:inline-block;width:30px;height:30px;vertical-align:middle;margin-right:8px}
.hs-confirm .hs-mascot-sm{width:92px;margin:0 auto 6px}
.hs-brand svg{display:block}
.hs-mark{background:none!important;width:auto;height:auto}
.hs-top{box-shadow:0 1px 0 var(--line),0 8px 24px -20px rgba(10,37,64,.35)}
@media(max-width:520px){.hs-trust{grid-template-columns:1fr}.hs-hero-art .hs-mascot{width:110px}}
/* mascot motion */
.hs-mascot *{transform-box:view-box}
.hs-mascot .m-float{animation:m-float 4.2s ease-in-out infinite}
.hs-mascot .m-shadow{transform-origin:120px 256px;animation:m-shadow 4.2s ease-in-out infinite}
.hs-mascot .m-blink{animation:m-blink 5.4s infinite}
.hs-mascot .m-arm{animation:m-wave 3.6s ease-in-out infinite}
.hs-mascot .m-armL{transform-origin:62px 138px;animation:m-armL 4.2s ease-in-out infinite}
.hs-mascot .m-head{animation:m-bob 3.4s ease-in-out infinite}
.hs-mascot .m-tw{animation:m-tw 2.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.hs-mascot .m-tw.t2{animation-delay:.9s}.hs-mascot .m-tw.t3{animation-delay:1.7s}
.hs-mascot .m-open{opacity:0;transition:opacity .2s}
.hs-mascot .m-smile{transition:opacity .2s}
.hs-mascot .m-brow{transition:opacity .2s}
.hs-m-calling .m-ring{animation:m-ring 1.4s ease-out infinite}.hs-m-calling .m-ring.r2{animation-delay:.3s}
.hs-m-calling .m-mic{animation:m-mic 1s ease-in-out infinite;transform-origin:104px 168px;transform-box:fill-box}
.hs-m-calling .m-float{animation:m-float 2.6s ease-in-out infinite}
.hs-m-happy .m-open{opacity:1}.hs-m-happy .m-smile{opacity:0}.hs-m-happy .m-brow{opacity:1}
.hs-m-happy .m-float{animation:m-jump .9s cubic-bezier(.3,1.6,.5,1) 1,m-float 4.2s ease-in-out .9s infinite}
.hs-m-happy .m-arm{animation:m-wave 1.2s ease-in-out infinite}
@keyframes m-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes m-shadow{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
@keyframes m-jump{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.05,.93)}55%{transform:translateY(-26px) scale(.97,1.04)}80%{transform:translateY(0) scale(1.04,.95)}100%{transform:translateY(0) scale(1)}}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}95.500%{transform:scaleY(.08)}}
@keyframes m-wave{0%,55%,100%{transform:rotate(0)}62%{transform:rotate(-18deg)}70%{transform:rotate(14deg)}78%{transform:rotate(-16deg)}86%{transform:rotate(10deg)}94%{transform:rotate(-4deg)}}
@keyframes m-armL{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
@keyframes m-bob{0%,100%{transform:rotate(-1.200deg)}50%{transform:rotate(1.400deg) translateY(-1px)}}
@keyframes m-tw{0%,100%{opacity:.35;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@keyframes m-ring{0%{opacity:.8;transform:scale(1);transform-origin:center;transform-box:fill-box}100%{opacity:0;transform:scale(1.9);transform-origin:center;transform-box:fill-box}}
@keyframes m-mic{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){.hs-mascot *{animation:none!important}}
.hs-pill.scheduled{background:#e5ebfb;color:#2a3f9a}
.hs-btn svg{margin-right:10px;flex:none}
.hs-btn.outline{background:#fff;color:var(--navy);border:1.500px solid var(--navy);box-shadow:none}
.hs-btn.outline.open{background:var(--mint)}
.hs-or{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--mut);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.hs-or::before,.hs-or::after{content:"";flex:1;height:1px;background:var(--line)}
.hs-sched{margin:14px 0 4px;padding:16px;background:#f4f8fd;border:1px solid var(--line);border-radius:16px}
.hs-sched fieldset{margin-bottom:12px}
.hs-date{margin-top:10px}
.hs-chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.hs-tabs button{white-space:nowrap}
/* v4: journey + dashboard */
.hs-skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;z-index:9}.hs-skip:focus{left:8px}
.hs-stepper{display:flex;list-style:none;margin:0 0 18px;padding:0;gap:6px}

.hs-stepper li span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#e8eef7;color:var(--mut);font-weight:700;font-size:12px}
.hs-stepper li::after{content:"";height:3px;border-radius:3px;background:#e1e9f3;order:3}
.hs-stepper li.now span{background:var(--navy);color:#fff}.hs-stepper li.now::after,.hs-stepper li.done::after{background:var(--teal)}
.hs-stepper li.done span{background:var(--teal);color:#fff}.hs-stepper li.now{color:var(--navy);font-weight:600}.hs-stepper em{font-style:normal}
.hs-sub{margin:-6px 0 16px;color:var(--mut);font-size:14px}
.hs-choice{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hs-choice button{font:inherit;font-size:14px;padding:10px 14px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);cursor:pointer}
.hs-choice button.on{border-color:var(--teal);background:var(--mint);color:var(--navy);font-weight:600;box-shadow:inset 0 0 0 1px var(--teal)}
.hs-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}

.hs-tile b{font-family:Georgia,serif;font-weight:500;font-size:18px}
.hs-tile.on{border-color:var(--teal);background:var(--mint);box-shadow:inset 0 0 0 1px var(--teal)}

.hs-btn.small{width:auto;padding:8px 16px;min-height:44px}.hs-btn:disabled{opacity:.5;cursor:not-allowed}

.hs-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.hs-kpi{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column}
.hs-kpi span{font-size:12px;color:#b6cdea}.hs-kpi b{font-family:Georgia,serif;font-weight:500;font-size:clamp(24px,3vw,32px)}.hs-kpi i{font-style:normal;font-size:12px;color:#b6cdea}
.hs-kpi.hot{background:#fff;border-color:#fff}.hs-kpi.hot span,.hs-kpi.hot i{color:var(--mut)}.hs-kpi.hot b{color:var(--navy)}
.hs-kpi i.up{color:#9be3b6}.hs-kpi i.down{color:#ffd09a}
.hs-views{display:inline-flex;gap:4px;background:#e9f0fa;padding:4px;border-radius:999px;margin-bottom:16px;max-width:100%;overflow-x:auto}
.hs-views button{flex:none;border:0;background:transparent;font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;color:var(--teal2);cursor:pointer;min-height:44px;white-space:nowrap}
.hs-views button.on{background:var(--navy);color:#fff}
.hs-toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.hs-toolbar .hs-tabs{margin:0}
.hs-search{font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;min-height:44px;min-width:220px;color:var(--ink)}
.hs-row.urgent{border-color:#e8a44a;background:#fffaf1}
.hs-row-main u.u{background:#c2410c}
.hs-next{border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.hs-next b{font-size:15px}.hs-next.hot{background:#fff1e6;border:1px solid #f0b57a;color:#7a3306}.hs-next.warn{background:#fff8e6;border:1px solid #f1d58f;color:#6a4a06}
.hs-next.ok{background:#e9f6ee;border:1px solid #bfe3cd;color:#1b5a39}.hs-next.calm{background:#eef4fb;border:1px solid #d3e1f2;color:var(--navy)}
.hs-gentle{background:#f3eefb;border:1px solid #dacbf0;color:#4a2f7a;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.hs-ans,.hs-notes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hs-ans li{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 12px;background:#f4f8fd;border-radius:10px}.hs-ans span{color:var(--mut)}.hs-ans b{color:var(--navy);text-align:right}
.hs-notes li{font-size:14px;padding:8px 12px;border-left:3px solid var(--gold);background:#fffaf0;border-radius:0 10px 10px 0}
.hs-noteform{display:flex;gap:8px;margin-top:16px}.hs-noteform input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;min-height:44px}
.hs-sched-view,.hs-insights{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hs-panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2.5vw,26px)}.hs-panel.wide{grid-column:1/-1}
.hs-panel h2{font-size:22px;margin-bottom:4px}.hs-panel .hs-sub{margin:0 0 16px}
.hs-agenda{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hs-agenda button{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;background:#f4f8fd;border:1px solid transparent;border-radius:14px;padding:10px 14px;cursor:pointer;color:var(--ink);min-height:56px}
.hs-agenda button:hover{border-color:var(--teal)}.hs-agenda time{flex:none;min-width:118px;font-weight:700;color:var(--navy);font-size:14px}
.hs-agenda b{display:block}.hs-agenda i{display:block;font-style:normal;font-size:13px;color:var(--mut)}
.hs-bar{display:grid;grid-template-columns:130px 1fr 36px;gap:12px;align-items:center;margin:10px 0;font-size:14px}
.hs-bar>div{height:12px;border-radius:12px;background:#e8eef7;overflow:hidden;position:relative}.hs-bar>div i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,var(--teal),#3b8be0)}
.hs-bar b,.hs-bar em{font-style:normal;text-align:right;color:var(--navy);font-weight:600}.hs-bar span{color:var(--mut)}
.hs-bar.thin{grid-template-columns:70px 1fr 40px;margin:6px 0}.hs-bar.thin>div{height:9px}.hs-bar.gold>div i{background:linear-gradient(90deg,#c9a45f,#a9854f)}
.hs-bar>div.base::after{content:"";position:absolute;left:30%;top:-2px;bottom:-2px;width:2px;background:var(--navy)}
.hs-cl{padding:10px 0;border-top:1px solid var(--line)}.hs-cl:first-of-type{border-top:0}.hs-cl>b{color:var(--navy)}
@media(max-width:900px){.hs-kpis{grid-template-columns:repeat(2,1fr)}.hs-sched-view,.hs-insights{grid-template-columns:1fr}}
@media(max-width:520px){.hs-tiles{grid-template-columns:1fr 1fr}.hs-bar{grid-template-columns:100px 1fr 30px}.hs-agenda time{min-width:96px}.hs-search{width:100%}.hs-nav .hs-btn{min-width:0;flex:1}.hs-stepper em{font-size:11px}}
.hs-app button:focus-visible,.hs-app input:focus-visible,.hs-app select:focus-visible{outline:3px solid #f2c46d;outline-offset:2px}
.hs-btn,.hs-chip,.hs-tile,.hs-choice button,.hs-row{transition:border-color .15s,background .15s,transform .15s}
.hs-btn:active{transform:translateY(1px)}
.hs-cl small{font-weight:400;font-size:12px;color:var(--mut);margin-left:6px}
/* v5: clarity pass */
.hs-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:8px}
.hs-choice button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;min-height:48px;border-radius:12px}
.hs-choice button::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;border:1.500px solid #9fb2cb;background:#fff}
.hs-choice button.on::before{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 0 4px,#fff 5px)}
.hs-choice button.on{font-weight:600}
.hs-tiles{grid-template-columns:repeat(2,1fr);gap:10px}
.hs-tile{display:flex;flex-direction:column;gap:2px;justify-content:center;min-height:72px;padding:12px 14px}
.hs-tile b{font-family:inherit;font-size:15px;font-weight:600;color:var(--navy)}
.hs-tile span{font-size:12.500px;color:var(--mut);line-height:1.35}
.hs-tile.on span{color:var(--navy)}
.hs-form-card fieldset{margin-bottom:18px}
.hs-form-card legend{font-size:14px;color:var(--navy);font-weight:600;margin-bottom:2px}
.hs-form-card label{font-size:14px;color:var(--navy);font-weight:600}
.hs-expect{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px}
.hs-expect li{position:relative;padding-left:30px}
.hs-expect li::before{content:"\2713";position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;background:var(--mint);color:#1b5fa8;font-size:11px;font-weight:700;display:grid;place-items:center}
.hs-expect b{display:block;color:var(--navy);font-size:15px}.hs-expect span{color:var(--mut);font-size:14px}
.hs-trust{gap:14px}.hs-trust div{line-height:1.45}
.hs-hero .hs-lead{margin-bottom:8px}
.hs-hero-art{margin:22px 0 0}
.hs-callrec{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe}
.hs-callrec summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:600;color:var(--navy);display:flex;justify-content:space-between;min-height:44px;align-items:center}
.hs-callrec summary::-webkit-details-marker{display:none}.hs-callrec summary em{font-style:normal;font-weight:400;color:var(--mut);font-size:13px}
.hs-callrec[open] summary{border-bottom:1px solid var(--line)}.hs-callrec .hs-tr{padding:12px}
.hs-ans{grid-template-columns:1fr 1fr}.hs-ans li{flex-direction:column;gap:2px;justify-content:flex-start}.hs-ans b{text-align:left}
.hs-detail h3{margin:20px 0 8px}
.hs-nav .hs-btn{min-height:48px}
.hs-switch button{white-space:nowrap}
@media(max-width:520px){.hs-ans{grid-template-columns:1fr}.hs-choice{grid-template-columns:1fr}.hs-tile span{display:block}}

/* v6: repeat booking notice */
.hs-dupfacts{display:grid;grid-template-columns:1fr;gap:0;margin:14px 0;border:1px solid var(--line,#dbe5f1);border-radius:14px;overflow:hidden;background:#fff}
.hs-dupfacts div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-top:1px solid var(--line,#e3ebf5)}
.hs-dupfacts div:first-child{border-top:0}
.hs-dupfacts dt{color:#5b6b82;font-size:14px}.hs-dupfacts dd{margin:0;font-weight:600;color:#0d2545;text-align:right}
.hs-ask{background:#f3f7fc;border-radius:14px;padding:16px;margin:6px 0 10px}
.hs-ask>b{display:block;color:#0d2545;font-size:17px;margin-bottom:10px}
.hs-ask .hs-actions{margin:0}
.hs-dup .hs-link{display:block;margin:6px auto 0}

/* v7 */
.hs-preview{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 4px;padding:10px 12px;border:1px dashed #b9c8dc;border-radius:12px;font-size:13px;color:#5b6b82}
.hs-preview button{border:1px solid #c6d4e6;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;color:#0d2545;cursor:pointer;min-height:32px}
.hs-preview button.on{background:#0d2545;color:#fff;border-color:#0d2545}
.hs-how2{margin-top:18px;border:1px solid #d6e1ef;border-radius:14px;background:#fff;padding:0 16px}
.hs-how2 summary{cursor:pointer;padding:14px 0;font-weight:700;color:#0d2545;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hs-how2 summary::-webkit-details-marker{display:none}
.hs-how2 summary em{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a6a1f;background:#f8f1de;border-radius:999px;padding:3px 10px}
.hs-how2 dl{margin:0 0 14px}.hs-how2 dt{font-weight:700;color:#0d2545;margin-top:10px;font-size:14px}.hs-how2 dd{margin:3px 0 0;color:#4a5a72;font-size:14px;line-height:1.5}
.hs-row-main b u.r{background:#e8eefc;color:#2a4a9a}
/* v8: touch targets */
.hs-preview button{min-height:44px;min-width:64px;padding:8px 18px}

/* v8: responsive polish */
.hs-views .short{display:none}
@media(max-width:900px){.hs-search{flex:1 1 100%;min-width:0;width:100%}.hs-toolbar{align-items:stretch}.hs-detail{scroll-margin-top:12px}}
@media(max-width:600px){
 .hs-views{display:grid;grid-template-columns:repeat(3,1fr);width:100%;overflow:visible}
 .hs-views button{padding:9px 6px;font-size:14px;text-align:center}
 .hs-views .full{display:none}.hs-views .short{display:inline}
 .hs-toolbar .hs-tabs{flex-wrap:wrap;overflow:visible}
 .hs-tabs button{padding:8px 14px}
}
